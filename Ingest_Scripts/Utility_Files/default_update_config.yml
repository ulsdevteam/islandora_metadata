task: [INGEST_TASK]
host: "https://digital.library.pitt.edu/"
username: ingester
password: [ISLANDORA_PASSWORD]
input_dir: /workbench/batches/[BATCH_DIRECTORY]/import
input_csv: /workbench/batches/[BATCH_DIRECTORY]/import/[BATCH_FILE]
#input_csv: "https://docs.google.com/spreadsheets/d/[INGEST_SHEET_ID]/edit"
#google_sheets_gid: [GID]
log_file_path: /workbench/batches/[BATCH_DIRECTORY]/logs/workbench_[BATCH_PREFIX].log
temp_dir: /workbench/batches/[BATCH_DIRECTORY]/tmp/
perform_soft_checks: true
adaptive_pause: 2
adaptive_pause_threshold: 2.5 
http_cache_storage: memory
http_cache_storage_expire_after: 600
columns_with_term_names:
 - field_temporal_subject
#update_mode: replace [replace is the default; append and delete are the alternatives]
#validate_terms_exist: false
#allow_adding_terms: true
#log_term_creation: false
#validate_title_length: false [use this if your site uses the Node Title Length module to allow for longer titles]
#log_file_name_and_line_number: true
#log_json: true
#log_request_url: true
#log_headers: true
#log_response_status_code: true
#log_response_body: true